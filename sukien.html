<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sukien.css">
</head>

<body>
<h3>Thể thao</h3>

<input type="text" id="search" placeholder="Tìm sự kiện...">

<div class="slider-container">
  <div class="slider" id="slider"></div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="event-box">

    <div class="event-info">
      <h2 id="modal-title"></h2>
      <p>⏰ <span id="modal-time"></span></p>
      <p>📍 <span id="modal-location"></span></p>
      <hr>
      <h3 id="modal-price"></h3>
      <button class="buy-btn">Mua vé ngay</button>
    </div>

    <div class="event-img">
      <img id="modal-img">
    </div>

    <span class="close" onclick="closeModal()">✖</span>
  </div>
</div>

   <div class="card"><img src="image18.jpg" width="340" height="200" alt="Ảnh 18"></div>
   <div class="card"><img src="image19.jpg" width="340" height="200" alt="Ảnh 19"></div>
  <div class="card"><img src="image20.jpg" width="340" height="200" alt="Ảnh 20"></div>
   <div class="card"><img src="image21.jpg" width="340" height="200" alt="Ảnh 21"></div>
   <div class="card"><img src="image22.jpg" width="340" height="200" alt="Ảnh 22"></div>
   <div class="card"><img src="image23.jpg" width="340" height="200" alt="Ảnh 23"></div>
   <div class="card"><img src="image24.jpg" width="340" height="200" alt="Ảnh 24"></div>
   <div class="card"><img src="image25.jpg" width="340" height="200" alt="Ảnh 25"></div>
</div>
<div id="modal" class="modal">
  <div class="modal-content">
    <span onclick="closeModal()">❌</span>
    <img id="modal-img">
    <h3 id="modal-title"></h3>
    <p id="modal-desc"></p>
  </div>
</div>
<button class="btn next" onclick="moveSlide(1)">❯</button>
 <button class="btn prev" onclick="moveSlide(-1)">❮ </button>
</div>
<div id="paymentBox" style="display:none; text-align:center;">
  <h3>Quét QR để thanh toán</h3>
  <img id="qr" width="200">
  <p id="countdown"></p>
</div>

 <script src="sukien.js"></script>
 </body>
</html>
