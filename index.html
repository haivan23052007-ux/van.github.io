<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 32px;
  background: #f6f7fb;
  color: #111827;
}

h2 {
  margin: 32px 0 16px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 20px;
}

.card {
  border: 1px solid #dbe1ea;
  border-radius: 16px;
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  background: #fff;
  display: flex;
  flex-direction: column;
  min-height: 320px;
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
}

.card img {
  width: 100%;
  height: 160px;
  object-fit: cover;
}

.card-body {
  padding: 12px 14px 16px;
}

.card h3 {
  margin: 0 0 10px;
  font-size: 16px;
  min-height: 40px;
}

.card p {
  margin: 4px 0;
  font-size: 14px;
  color: #4b5563;
}

.empty {
  color: #64748b;
  font-size: 14px;
}
</style>
</head>
<body>

<h2>Concert</h2>
<div class="grid" id="concertGrid"></div>

<h2>Sport</h2>
<div class="grid" id="sportGrid"></div>

<h2>Game</h2>
<div class="grid" id="gameGrid"></div>

<h2>Special</h2>
<div class="grid" id="specialGrid"></div>

<script src="data-store.js"></script>
<script>
const categoryMap = {
  concert: "concertGrid",
  sport: "sportGrid",
  game: "gameGrid",
  special: "specialGrid"
};

function renderByCategory(database, category, containerId) {
  const container = document.getElementById(containerId);
  const filteredEvents = database.events.filter((event) => event.category === category);

  if (!filteredEvents.length) {
    container.innerHTML = '<p class="empty">Chưa có sự kiện.</p>';
    return;
  }

  container.innerHTML = "";

  filteredEvents.forEach((event) => {
    const schedules = EventStore.getSchedulesByEventId(database, event.id);
    const firstSchedule = schedules[0];
    const lowestPrice = firstSchedule ? EventStore.getLowestPrice(firstSchedule) : 0;

    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <img src="${event.banner}" alt="${event.title}">
      <div class="card-body">
        <h3>${event.title}</h3>
        <p>${firstSchedule ? EventStore.formatDate(firstSchedule.date) : "Chưa có lịch"}</p>
        <p>${event.city}</p>
        <p>${EventStore.formatCurrency(lowestPrice)}</p>
      </div>
    `;

    card.onclick = function () {
      localStorage.setItem("selectedEventId", event.id);
      if (firstSchedule) {
        localStorage.setItem("selectedScheduleId", firstSchedule.id);
      } else {
        localStorage.removeItem("selectedScheduleId");
      }
      window.location.href = "detail.html";
    };

    container.appendChild(card);
  });
}

async function init() {
  try {
    const database = await EventStore.loadDatabase();

    Object.entries(categoryMap).forEach(([category, containerId]) => {
      renderByCategory(database, category, containerId);
    });
  } catch (error) {
    document.body.innerHTML = `<p>Không tải được dữ liệu: ${error.message}</p>`;
  }
}

init();
</script>
</body>
</html>
